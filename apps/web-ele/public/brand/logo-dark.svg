<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tide">
  <title>Tide · 字母标 T（暗色主题）</title>
  <desc>正体矩形笔形的白色 T（横竖笔同厚、圆角端头）立于潮线之上。</desc>
  <defs>
    <linearGradient id="bMark" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1656CC" />
      <stop offset="0.52" stop-color="#2186F5" />
      <stop offset="1" stop-color="#3FD0FA" />
    </linearGradient>
    <clipPath id="bBadge">
      <rect width="64" height="64" rx="17" />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#bMark)" />

  <g clip-path="url(#bBadge)">
    <!-- 字母标 T：横笔 34×7.6、竖笔同厚 7.6，圆角端头；竖笔沉入横笔 2 保证接缝融合。
         竖向占 y 10–35.8，底端与潮线峰顶（y≈42.9）净空 7.2px -->
    <rect x="15" y="10" width="34" height="7.6" rx="3.8" fill="#FFFFFF" />
    <rect x="28.2" y="12" width="7.6" height="23.8" rx="3.8" fill="#FFFFFF" />

    <!-- 潮线：峰线 y=49.5 / 谷线 y=58.5；水面以下 7% 白，波峰描边 92% 白 -->
    <path
      d="M-4 49.5 Q 7 40.5 18 49.5 Q 29 58.5 40 49.5 Q 51 40.5 62 49.5 Q 73 58.5 84 49.5 L 84 68 L -4 68 Z"
      fill="#FFFFFF"
      fill-opacity="0.07"
    />
    <path
      d="M-4 49.5 Q 7 40.5 18 49.5 Q 29 58.5 40 49.5 Q 51 40.5 62 49.5 Q 73 58.5 84 49.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-linecap="round"
      stroke-opacity="0.92"
      stroke-width="4.3"
    />
  </g>
</svg>
