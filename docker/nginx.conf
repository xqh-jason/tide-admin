# W7-1 前端 nginx 站点配置：静态资源 + /api 反代到后端容器（服务名 backend）
server {
    listen 80;
    server_name _;

    # 上传/下载走反代，对齐后端 upload.max_size_mb=10，留余量到 12m
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_vary on;

    # 静态资源：带 hash 的产物长缓存（index.html 不匹配该规则，避免旧壳缓存）
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代：前端统一 /api/v1 前缀，转到后端容器 8080
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # hash 路由单页入口（兜底；hash 模式下刷新不会请求路径，此规则主要防误访问）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
